name: Web game CI
on:
  push:
    branches: [main, feature/complete-label-management-gameplay]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: npm ci
      - name: Type-check and build website
        run: npm run build
      - name: Sync Capacitor Android project
        run: npx cap sync android
      - name: Compile Android debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
